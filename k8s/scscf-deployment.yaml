apiVersion: apps/v1
kind: Deployment
metadata:
  name: scscf
  namespace: vpp-ims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scscf
  template:
    metadata:
      labels:
        app: scscf
    spec:
      containers:
      - name: scscf
        image: kamailio/kamailio:latest
        ports:
        - containerPort: 5060
---
apiVersion: v1
kind: Service
metadata:
  name: scscf
  namespace: vpp-ims
spec:
  selector:
    app: scscf
  ports:
  - protocol: UDP
    port: 5060
    targetPort: 5060
