apiVersion: apps/v1
kind: Deployment
metadata:
  name: hss
  namespace: vpp-ims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hss
  template:
    metadata:
      labels:
        app: hss
    spec:
      containers:
      - name: hss
        image: freeims/hss:latest
        ports:
        - containerPort: 3868
---
apiVersion: v1
kind: Service
metadata:
  name: hss
  namespace: vpp-ims
spec:
  selector:
    app: hss
  ports:
  - protocol: TCP
    port: 3868
    targetPort: 3868
